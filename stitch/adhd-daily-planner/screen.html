<script data-purpose="planner-interactivity">
    document.addEventListener('DOMContentLoaded', () => {
      // Auto fill today's date if empty
      const dateInput = document.getElementById('planner-date');
      if (dateInput && !dateInput.value) {
        const today = new Date();
        const options = { month: 'long', day: 'numeric', year: 'numeric' };
        dateInput.value = today.toLocaleDateString('en-US', options);
      }

      // Day of week button toggles
      const dayButtons = document.querySelectorAll('.day-btn');
      dayButtons.forEach((btn, index) => {
        btn.addEventListener('click', () => {
          dayButtons.forEach(b => {
            b.classList.remove('bg-slate-800', 'text-white', 'shadow-sm');
            b.classList.add('hover:bg-purple-300');
          });
          btn.classList.add('bg-slate-800', 'text-white', 'shadow-sm');
          btn.classList.remove('hover:bg-purple-300');
        });
      });

      // Strike-through effect for task checkboxes
      const checkboxes = document.querySelectorAll('.checkbox-square');
      checkboxes.forEach(cb => {
        cb.addEventListener('change', (e) => {
          const textInput = e.target.parentElement.querySelector('input[type="text"]');
          if (textInput) {
            if (e.target.checked) {
              textInput.classList.add('completed-task');
            } else {
              textInput.classList.remove('completed-task');
            }
          }
        });
      });

      // Clear button action
      const resetBtn = document.getElementById('reset-button');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          if (confirm('Clear today’s entries and reset all checkboxes?')) {
            document.querySelectorAll('input[type="text"]').forEach(input => {
              if (input.id !== 'planner-date') {
                input.value = '';
                input.classList.remove('completed-task');
              }
            });
            document.querySelectorAll('.checkbox-square').forEach(cb => {
              cb.checked = false;
            });
          }
        });
      }
    });
  </script>
